---
description: Pipeline for processing Intel 471 compromised credentials.
processors:
  - terminate:
      tag: terminate_data_collection_error_5c8e0a2b
      if: ctx.error?.message != null
      description: Error message set by the CEL program and no data to process.
  - set:
      tag: set_ecs_version_6d9f1b3c
      field: ecs.version
      value: '8.17.0'
  - rename:
      tag: rename_message_to_event_original_7e0a2c4d
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - remove:
      tag: remove_message_8f1b3d5e
      field: message
      ignore_missing: true
      if: ctx.event?.original != null
      description: The `message` field is no longer required if the document has an `event.original` field.
  - json:
      tag: json_event_original_9a2c4e6f
      field: event.original
      target_field: intel471.credential

  # Plaintext passwords are never indexed. The CEL program already drops them;
  # this catches any that arrive another way, together with the raw copy.
  - remove:
      tag: remove_event_original_with_plaintext_0b3d5f7a
      field: event.original
      ignore_missing: true
      if: ctx.intel471.credential.data?.password?.password_plain != null
  - append:
      tag: append_tag_plaintext_removed_1c4e6a8b
      field: tags
      value: intel471_plaintext_password_removed
      allow_duplicates: false
      if: ctx.intel471.credential.data?.password?.password_plain != null
  - remove:
      tag: remove_password_plain_2d5f7b9c
      field: intel471.credential.data.password.password_plain
      ignore_missing: true

  - fingerprint:
      tag: fingerprint_credential_3e6a8c0d
      fields:
        - intel471.credential
      target_field: _id
      description: >-
        The _id is a hash of the credential as received. Data streams reject a second document with the
        same _id, so a re-delivered page (at-least-once) is dropped as a duplicate, while an updated
        credential (new sighting, new credential set) hashes to a new _id and is indexed.

  ####################
  # Event ECS fields #
  ####################
  - set:
      tag: set_event_kind_4f7b9d1e
      field: event.kind
      value: alert
  - set:
      tag: set_event_category_5a8c0e2f
      field: event.category
      value: [threat]
  # No event.type: with category threat ECS only allows "indicator", and a
  # leaked credential isn't one.
  - set:
      tag: set_event_id_7c0e2a4b
      field: event.id
      copy_from: intel471.credential.id
      ignore_empty_value: true
  - set:
      tag: set_event_provider_8d1f3b5c
      field: event.provider
      value: Intel 471

  ##############
  # Timestamps #
  ##############
  - date:
      tag: date_last_updated_ts_9e2a4c6d
      field: intel471.credential.last_updated_ts
      target_field: intel471.credential.last_updated_ts
      formats: [ISO8601]
      if: ctx.intel471.credential.last_updated_ts != null
  - set:
      tag: set_timestamp_from_last_updated_0f3b5d7e
      field: '@timestamp'
      copy_from: intel471.credential.last_updated_ts
      ignore_empty_value: true
  - date:
      tag: date_first_seen_ts_1a4c6e8f
      field: intel471.credential.activity.first_seen_ts
      target_field: intel471.credential.activity.first_seen_ts
      formats: [ISO8601]
      if: ctx.intel471.credential.activity?.first_seen_ts != null
  - date:
      tag: date_last_seen_ts_2b5d7f9a
      field: intel471.credential.activity.last_seen_ts
      target_field: intel471.credential.activity.last_seen_ts
      formats: [ISO8601]
      if: ctx.intel471.credential.activity?.last_seen_ts != null
  - foreach:
      tag: foreach_infection_ts_3c6e8a0b
      field: intel471.credential.data.info_stealer.infection_ts
      ignore_missing: true
      processor:
        date:
          tag: date_infection_ts_4d7f9b1c
          field: _ingest._value
          target_field: _ingest._value
          formats: [ISO8601]

  #########
  # User  #
  #########
  # The login is usually an email address: user.email, with the part before the
  # @ as user.name. Other logins go to user.name as they are.
  - set:
      tag: set_user_email_5e8a0c2d
      field: user.email
      copy_from: intel471.credential.data.credential_login
      if: ctx.intel471.credential.data?.credential_login instanceof String && ctx.intel471.credential.data.credential_login.contains('@')
  - script:
      tag: script_user_name_6f9b1d3e
      lang: painless
      if: ctx.intel471.credential.data?.credential_login instanceof String && ctx.intel471.credential.data.credential_login != ''
      source: |
        String login = ctx.intel471.credential.data.credential_login;
        int at = login.lastIndexOf('@');
        ctx.user = ctx.user ?: [:];
        ctx.user.name = at > 0 ? login.substring(0, at) : login;
        if (at > 0 && at < login.length() - 1) {
          ctx.user.domain = login.substring(at + 1);
        }
  - set:
      tag: set_user_domain_7a0c2e4f
      field: user.domain
      copy_from: intel471.credential.data.credential_domain
      if: ctx.intel471.credential.data?.credential_domain != null && ctx.intel471.credential.data.credential_domain != ''
  - append:
      tag: append_related_user_login_8b1d3f5a
      field: related.user
      value: '{{{intel471.credential.data.credential_login}}}'
      allow_duplicates: false
      if: ctx.intel471.credential.data?.credential_login != null
  - append:
      tag: append_related_user_name_9c2e4a6b
      field: related.user
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: ctx.user?.name != null

  ###############################
  # Where the credential was used
  ###############################
  - set:
      tag: set_url_domain_0d3f5b7c
      field: url.domain
      copy_from: intel471.credential.data.accessed_domain
      if: ctx.intel471.credential.data?.accessed_domain != null && ctx.intel471.credential.data.accessed_domain != ''
  - append:
      tag: append_related_hosts_accessed_1e4a6c8d
      field: related.hosts
      value: '{{{intel471.credential.data.accessed_domain}}}'
      allow_duplicates: false
      if: ctx.intel471.credential.data?.accessed_domain != null && ctx.intel471.credential.data.accessed_domain != ''
  - foreach:
      tag: foreach_related_ip_2f5b7d9e
      field: intel471.credential.data.info_stealer.ip
      ignore_missing: true
      processor:
        append:
          tag: append_related_ip_3a6c8e0f
          field: related.ip
          value: '{{{_ingest._value}}}'
          allow_duplicates: false

  ###########
  # Cleanup #
  ###########
  - remove:
      tag: remove_deprecated_fields_4b7d9f1a
      description: Deprecated mirrors of accessed_domain and accessed_domains_count.
      ignore_missing: true
      field:
        - intel471.credential.data.accessed_url
        - intel471.credential.statistics.accessed_urls_count
  - remove:
      tag: remove_duplicate_custom_fields_5c8e0a2b
      description: These values have been copied to ECS fields.
      if: ctx.tags == null || !ctx.tags.contains('preserve_duplicate_custom_fields')
      ignore_missing: true
      field:
        - intel471.credential.id
        - intel471.credential.data.credential_login
        - intel471.credential.data.accessed_domain
  - remove:
      tag: remove_event_original_6d9f1b3c
      field: event.original
      ignore_missing: true
      if: ctx.tags == null || !ctx.tags.contains('preserve_original_event')
  - script:
      tag: script_drop_null_empty_values_7e0a2c4d
      description: Drops null/empty values recursively.
      lang: painless
      source: |
        boolean dropEmptyFields(Object object) {
          if (object == null || object == "") {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(value -> dropEmptyFields(value));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(value -> dropEmptyFields(value));
            return (((List) object).length == 0);
          }
          return false;
        }
        dropEmptyFields(ctx);
  - set:
      tag: set_pipeline_error_to_event_kind_8f1b3d5e
      field: event.kind
      value: pipeline_error
      if: ctx.error?.message != null
  - append:
      tag: append_preserve_original_event_on_error_9a2c4e6f
      field: tags
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      tag: append_error_message_0b3d5f7a
      field: error.message
      value: >-
        Processor "{{{ _ingest.on_failure_processor_type }}}"
        with tag "{{{ _ingest.on_failure_processor_tag }}}"
        in pipeline "{{{ _ingest.on_failure_pipeline }}}"
        failed with message "{{{ _ingest.on_failure_message }}}"
  - set:
      tag: set_event_kind_on_failure_1c4e6a8b
      field: event.kind
      value: pipeline_error
  - append:
      tag: append_tags_on_failure_2d5f7b9c
      field: tags
      value: preserve_original_event
      allow_duplicates: false
