title: "Credential"
type: logs
streams:
  - input: cel
    title: Credentials
    description: Collect compromised credentials from the Intel 471 Credentials API stream.
    template_path: cel.yml.hbs
    vars:
      - name: initial_interval
        type: text
        title: Initial Interval
        description: >-
          How far back to start the stream on the first run (for example 168h, 720h).
          This start point is saved with the cursor and never changes afterwards; to re-bootstrap,
          change the filters below or reinstall the integration. Supported units are h/m/s.
        default: 168h
        multi: false
        required: true
        show_user: true
      - name: interval
        type: text
        title: Interval
        description: How often to poll the API for new and updated credentials. Supported units are h/m/s.
        default: 15m
        multi: false
        required: true
        show_user: true
      - name: affiliation_group
        type: select
        title: Affiliation
        description: >-
          Only collect credentials with this affiliation to your organisation, as configured in your Intel 471
          account. The most effective way to limit volume.
        options:
          - text: All
            value: ""
          - text: My employees
            value: my_employees
          - text: VIP emails
            value: vip_emails
          - text: My customers
            value: my_customers
          - text: Third parties
            value: third_parties
        default: ""
        multi: false
        required: false
        show_user: true
      - name: page_size
        type: integer
        title: Page Size
        description: Number of credentials requested per page (1-1000).
        default: 1000
        multi: false
        required: true
        show_user: false
      - name: max_executions
        type: integer
        title: Maximum Pages Per Interval
        description: Maximum number of pages fetched before waiting for the next interval.
        default: 1000
        multi: false
        required: true
        show_user: false
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Valid time units are ns, us, ms, s, m, h.
        default: 60s
        multi: false
        required: true
        show_user: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - intel471-credential
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: >-
          Preserves a raw copy of the original credential, added to the field `event.original`. The plaintext
          password is never included.
        multi: false
        required: true
        show_user: true
        default: false
      - name: preserve_duplicate_custom_fields
        type: bool
        title: Preserve duplicate custom fields
        description: Preserve `intel471.credential` fields that were copied to Elastic Common Schema (ECS) fields.
        multi: false
        required: true
        show_user: false
        default: false
      - name: enable_request_tracer
        type: bool
        title: Enable request tracing
        description: >-
          The request tracer logs requests and responses to the agent's local file-system for debugging configurations.
          Enabling this request tracing compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        multi: false
        required: false
        show_user: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata.
          This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
        multi: false
        required: false
        show_user: false
