- name: intel471.credential
  type: group
  description: Fields from the Intel 471 Credentials API that have no ECS equivalent (or are kept alongside it). The plaintext password is never stored.
  fields:
    - name: id
      type: keyword
      description: Unique identifier of the credential.
    - name: last_updated_ts
      type: date
      description: When the credential was last updated.
    - name: activity
      type: group
      fields:
        - name: first_seen_ts
          type: date
          description: Start of the credential's activity range.
        - name: last_seen_ts
          type: date
          description: End of the credential's activity range.
    - name: classification.girs
      type: group
      description: General Intelligence Requirements (GIRs) that match the credential.
      fields:
        - name: name
          type: keyword
          description: GIR name.
        - name: path
          type: keyword
          description: GIR path, for example 1.1.13.
    - name: statistics.accessed_domains_count
      type: long
      description: Number of distinct domains the credential was used on.
    - name: data
      type: group
      description: The credential.
      fields:
        - name: credential_login
          type: keyword
          description: Login of the credential, usually an email address.
        - name: credential_domain
          type: keyword
          description: Domain of the login.
        - name: detection_domain
          type: keyword
          description: Monitored domain that caused the credential to be detected.
        - name: accessed_domain
          type: keyword
          description: Domain the credential was used on when it was captured.
        - name: affiliations
          type: keyword
          description: Affiliation to your organisation (my_employees, vip_emails, my_customers, third_parties).
        - name: credential_set_type
          type: keyword
          description: Types of the credential sets the credential was found in (infostealers, combolists, breaches).
        - name: credential_sets
          type: group
          description: Credential sets the credential was found in.
          fields:
            - name: id
              type: keyword
              description: Credential set identifier.
            - name: name
              type: keyword
              description: Credential set name.
        - name: password
          type: group
          description: Password metadata. The plaintext password is never stored.
          fields:
            - name: id
              type: keyword
              description: Opaque password identifier; equal IDs mean equal passwords.
            - name: strength
              type: keyword
              description: Password strength (excellent, strong, medium, weak, poor, not_provided).
            - name: complexity
              type: group
              description: Password complexity.
              fields:
                - name: length
                  type: long
                  description: Number of characters.
                - name: entropy
                  type: double
                  description: Password entropy.
                - name: score
                  type: double
                  description: Password score, 0 to 1.
                - name: weakness
                  type: double
                  description: Password weakness.
                - name: lowercase
                  type: long
                  description: Number of lowercase letters.
                - name: uppercase
                  type: long
                  description: Number of uppercase letters.
                - name: numbers
                  type: long
                  description: Number of digits.
                - name: punctuation_marks
                  type: long
                  description: Number of punctuation marks.
                - name: symbols
                  type: long
                  description: Number of symbols.
                - name: separators
                  type: long
                  description: Number of separators.
                - name: other
                  type: long
                  description: Number of other characters.
        - name: info_stealer
          type: group
          description: >-
            Information stealer details, when the credential was captured by one. Each field lists the values
            from every sighting of the credential; values in different fields are not paired.
          fields:
            - name: malware_family
              type: keyword
              description: Stealer families, for example Redline, Lumma, VIDAR.
            - name: version
              type: keyword
              description: Stealer versions.
            - name: infection_ts
              type: date
              description: When the machines were infected.
            - name: machine_id
              type: keyword
              description: Identifiers of the infected machines.
            - name: pc_name
              type: keyword
              description: Host names of the infected machines.
            - name: computer_username
              type: keyword
              description: Local user accounts on the infected machines.
            - name: ip
              type: ip
              description: IP addresses of the infected machines.
            - name: invalid_ip
              type: keyword
              description: Values the stealer reported as the machine's IP address that aren't valid IP addresses.
            - name: isp
              type: keyword
              description: Internet service providers of the infected machines.
            - name: os
              type: keyword
              description: Operating systems of the infected machines.
            - name: antivirus_software
              type: keyword
              description: Antivirus software reported on the infected machines.
            - name: malware_install_path
              type: keyword
              description: Where the stealer was installed.
            - name: screenshot_path
              type: keyword
              description: Paths of screenshots taken by the stealer.
